bundle:
  name: access-drift

workspace:
  root_path: /Shared/access-drift

sync:
  paths:
    - notebooks
    - data/poc/landing/raw
    - data/poc/eval
    - sql/databricks/migrations

variables:
  storage_account_name:
    description: ADLS Gen2 storage account name (Bicep output)
  openai_endpoint:
    description: Azure OpenAI endpoint (Bicep output)
  cluster_id:
    default: ""
  catalog:
    description: Unity Catalog catalog name (demo=access_drift / dev=access_drift_dev)
    default: access_drift_dev

targets:
  # demo: 발표·검증용 고정 fixture. access_drift catalog의 PoC 데이터를 재사용한다.
  # 이 target을 실행하면 access_drift catalog의 데이터가 덮어 쓰이므로 dev 데이터와 혼용하지 않는다.
  demo:
    variables:
      storage_account_name: acdriftadls
      openai_endpoint: "https://acdrift-oai.openai.azure.com/"
      cluster_id: "0623-064735-g02akt45"
      catalog: access_drift

  # dev: 본개발·탐색용. access_drift_dev catalog를 사용해 demo fixture와 분리한다.
  dev:
    default: true
    variables:
      storage_account_name: acdriftadls
      openai_endpoint: "https://acdrift-oai.openai.azure.com/"
      cluster_id: "0623-064735-g02akt45"
      catalog: access_drift_dev

resources:
  jobs:
    access-drift-pipeline:
      name: access-drift-pipeline
      tasks:
        - task_key: migration_task
          description: DDL 적용 — sql/databricks/migrations/*.sql 순서대로 실행
          notebook_task:
            notebook_path: ./notebooks/00_apply_migrations.py
            base_parameters:
              catalog: ${var.catalog}
          existing_cluster_id: ${var.cluster_id}

        - task_key: synthetic_data_task
          description: seed 파일을 ADLS raw/ 에 복사 (10건 × 6종)
          depends_on:
            - task_key: migration_task
          notebook_task:
            notebook_path: ./notebooks/01_synthetic_data.py
            base_parameters:
              catalog: ${var.catalog}
              storage_account: ${var.storage_account_name}
          existing_cluster_id: ${var.cluster_id}

        - task_key: ingest_task
          description: ADLS raw/ JSONL → Bronze Delta
          depends_on:
            - task_key: synthetic_data_task
          notebook_task:
            notebook_path: ./notebooks/02_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              storage_account: ${var.storage_account_name}
          existing_cluster_id: ${var.cluster_id}

        - task_key: silver_task
          description: Bronze → Silver 정규화 (principals=20, credentials=10, assets=10, edges=20)
          depends_on:
            - task_key: ingest_task
          notebook_task:
            notebook_path: ./notebooks/03_silver.py
            base_parameters:
              catalog: ${var.catalog}
          existing_cluster_id: ${var.cluster_id}

        - task_key: eval_seed_task
          description: eval ground_truth_case seed 적재 + Silver 매칭 검증 (탐지 파이프라인과 독립)
          depends_on:
            - task_key: silver_task
          notebook_task:
            notebook_path: ./notebooks/04_eval_seed.py
            base_parameters:
              catalog: ${var.catalog}
          existing_cluster_id: ${var.cluster_id}
