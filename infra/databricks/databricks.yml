bundle:
  name: access-drift

variables:
  storage_account_name:
    description: ADLS Gen2 storage account name (Bicep output)
  openai_endpoint:
    description: Azure OpenAI endpoint (Bicep output)
  cluster_id:
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      storage_account_name: acdriftadls
      openai_endpoint: "https://acdrift-oai.openai.azure.com/"
      cluster_id: "0623-064735-g02akt45"

resources:
  jobs:
    access-drift-pipeline:
      name: access-drift-pipeline
      tasks:
        - task_key: synthetic_data_task
          description: 실제 API 스키마 기반 합성 데이터 생성 → Landing
          notebook_task:
            notebook_path: /Shared/access-drift/notebooks/01_synthetic_data
          existing_cluster_id: ${var.cluster_id}

        - task_key: ingest_task
          description: Auto Loader → Bronze
          depends_on:
            - task_key: synthetic_data_task
          notebook_task:
            notebook_path: /Shared/access-drift/notebooks/02_ingest
          existing_cluster_id: ${var.cluster_id}

        - task_key: silver_task
          description: 정규화 + 품질 체크
          depends_on:
            - task_key: ingest_task
          notebook_task:
            notebook_path: /Shared/access-drift/notebooks/03_silver
          existing_cluster_id: ${var.cluster_id}
