name: "Task - DE"
description: "데이터 수집, 적재, 스키마, 파이프라인, 인프라 관련 작업을 작성합니다."
title: "[DE][P0] "
labels:
  - task
  - S1
  - team:de
  - priority:p0
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      placeholder: 무엇을 작업하나요?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      placeholder: 왜 필요한 작업인가요?
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 기대 결과
      description: 이 작업이 끝났을 때 어떤 상태가 되어야 하는지 적어주세요.
      placeholder: |
        예:
        - 특정 레이어에 데이터가 적재된다.
        - 스키마 또는 경로 정책이 정리된다.
        - 재실행 시 중복이 발생하지 않는다.
        - Databricks에서 조회 가능한 상태가 된다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 이슈에서 포함할 작업과 제외할 작업을 구분해 적어주세요.
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] 기대 결과가 충족된다.
        - [ ] P0 / P1 / P2 우선순위가 제목 또는 본문에 명확히 표시된다.
        - [ ] 데이터 건수뿐 아니라 샘플 내용, 필드 매핑, 누락, 중복, 타입 또는 포맷 오류 여부를 확인한다.
        - [ ] 필요한 확인 결과가 PR 또는 이슈 댓글에 기록된다.
        - [ ] 확인하지 못한 항목이 있으면 이유가 기록된다.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 확인 관점
      description: 구현자가 완료 여부를 판단할 때 확인해야 할 조건을 적어주세요.
      value: |
        정상 케이스:
        -

        실패 또는 예외 케이스:
        -

        데이터, 상태, 로그, 출력 등 확인할 대상:
        -

        특별히 주의할 점:
        -
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: 참고
      placeholder: |
        상위 이슈: #번호 (있는 경우)
        관련 문서, 테이블, 노트북, SQL, 주의할 점이 있으면 적어주세요.
