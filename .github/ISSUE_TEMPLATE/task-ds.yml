name: "Task - DS"
description: "탐지 로직, 평가, Intermediate/Gold 결과 모델 관련 작업을 작성합니다."
title: "[DS][M] "
labels:
  - task
  - S1
  - area:ds
  - priority:must
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      placeholder: 무엇을 작업하나요?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      placeholder: 왜 필요한 작업인가요?
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 기대 결과
      description: 이 작업이 끝났을 때 어떤 상태가 되어야 하는지 적어주세요.
      placeholder: |
        예:
        - Silver 입력 기준으로 탐지 결과가 생성된다.
        - Intermediate 또는 Gold 결과가 조회된다.
        - eval 정답지와 비교 가능한 key가 정리된다.
        - Risk Card에 필요한 필드가 채워진다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 이슈에서 포함할 작업과 제외할 작업을 구분해 적어주세요.
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] 기대 결과가 충족된다.
        - [ ] Must / Should / Could 우선순위가 제목 또는 본문에 명확히 표시된다.
        - [ ] 입력 Silver 테이블과 사용 컬럼이 기록된다.
        - [ ] 결과 테이블의 핵심 key와 근거 추적 방법이 기록된다.
        - [ ] 필요한 확인 결과가 PR 또는 이슈 댓글에 기록된다.
        - [ ] 확인하지 못한 항목이 있으면 이유가 기록된다.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 확인 관점
      description: 구현자가 완료 여부를 판단할 때 확인해야 할 조건을 적어주세요.
      value: |
        정상 케이스:
        -

        실패 또는 예외 케이스:
        -

        데이터, 상태, 로그, 출력 등 확인할 대상:
        -

        특별히 주의할 점:
        -
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: 참고
      placeholder: |
        상위 이슈: #번호 (있는 경우)
        관련 계약 문서, 테이블, 노트북, SQL, 주의할 점이 있으면 적어주세요.
