name: "Task"
description: "일반 작업 이슈를 작성합니다."
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      placeholder: 무엇을 작업하나요?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      placeholder: 왜 필요한 작업인가요?
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 기대 결과
      description: 이 작업이 끝났을 때 어떤 상태가 되어야 하는지 적어주세요.
      placeholder: |
        예:
        - 특정 기능이 동작한다.
        - 특정 데이터가 생성된다.
        - 특정 오류가 재발하지 않는다.
        - 특정 설정이나 구조가 정리된다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 이슈에서 포함할 작업과 제외할 작업을 구분해 적어주세요.
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] 기대 결과가 충족된다.
        - [ ] 필요한 확인 결과가 PR에 기록된다.
        - [ ] 확인하지 못한 항목이 있으면 PR에 이유가 기록된다.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 확인 관점
      description: 구현자가 완료 여부를 판단할 때 확인해야 할 조건을 적어주세요. 구체적인 명령어나 구현 방법을 몰라도 됩니다.
      value: |
        정상 케이스:
        -

        실패 또는 예외 케이스:
        -

        데이터, 상태, 로그, 출력 등 확인할 대상:
        -

        특별히 주의할 점:
        -
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: 참고
      placeholder: |
        상위 이슈: #번호 (있는 경우)
        관련 화면, 링크, 파일, 주의할 점이 있으면 적어주세요.
