name: "Task - PO"
description: "제품 범위, 사용자 시나리오, 데모 흐름 관련 작업을 작성합니다."
title: "[PO][M] "
labels:
  - task
  - S1
  - area:product
  - priority:must
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      placeholder: 무엇을 작업하나요?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목적
      placeholder: 왜 필요한 작업인가요?
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: 기대 결과
      description: 이 작업이 끝났을 때 어떤 상태가 되어야 하는지 적어주세요.
      placeholder: |
        예:
        - 사용자 시나리오가 명확해진다.
        - PoC 범위 또는 우선순위가 정리된다.
        - 데모에서 확인할 흐름이 구체화된다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 이슈에서 포함할 작업과 제외할 작업을 구분해 적어주세요.
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      value: |
        - [ ] 기대 결과가 충족된다.
        - [ ] Must / Should / Could 우선순위가 제목 또는 본문에 명확히 표시된다.
        - [ ] 필요한 확인 결과가 PR 또는 이슈 댓글에 기록된다.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 확인 관점
      description: 완료 여부를 판단할 때 확인해야 할 조건을 적어주세요.
      value: |
        사용자/제품 관점:
        -

        데모 또는 발표 영향:
        -

        남은 리스크:
        -
    validations:
      required: false

  - type: textarea
    id: reference
    attributes:
      label: 참고
      placeholder: |
        상위 이슈: #번호 (있는 경우)
        관련 문서, 화면, 회의 메모, 주의할 점이 있으면 적어주세요.
